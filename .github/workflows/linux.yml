name: beanstalk

on:
  push:
    branches:
      - master
      - stable
  pull_request:
    branches:
      - master
      - stable

jobs:
  beanstalk_test:
    name: Beanstalk plugin (Go ${{ matrix.go }}, PHP ${{ matrix.php }}, OS ${{matrix.os}})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        php: ["8.5"]
        go: [stable]
        os: ["ubuntu-latest"]
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: ${{ matrix.go }}

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2 # action page: <https://github.com/shivammathur/setup-php>
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets

      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          cd tests/php_test_files
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Init Composer Cache # Docs: <https://git.io/JfAKn#php---composer>
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: cd tests/php_test_files && composer update --prefer-dist --no-progress --ansi

      - name: Init Go modules Cache # Docs: <https://git.io/JfAKn#go---modules>
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install Go dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: |
          mkdir ./tests/coverage-ci
          go test -timeout 5m -v -race -cover -tags=debug -coverpkg=./... -coverprofile=./tests/coverage-ci/beanstalk_u.out -covermode=atomic ./...

      - name: Start the broker
        run: docker compose -f tests/env/docker-compose.yaml up -d --wait

      - name: Run golang tests with coverage
        run: |
          cd tests
          mkdir -p ./coverage-ci
          go test -timeout 20m -v -race -cover -tags=debug -coverpkg=github.com/roadrunner-server/beanstalk/v6/... -coverprofile=./coverage-ci/beanstalk.out -covermode=atomic -skip TestRedialAfterOutage ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-beanstalk
          path: ./tests/coverage-ci/

  beanstalk_durability:
    name: Beanstalk durability plugin (Go ${{ matrix.go }}, PHP ${{ matrix.php }}, OS ${{matrix.os}})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        php: ["8.5"]
        go: [stable]
        os: ["ubuntu-latest"]
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: ${{ matrix.go }}

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2 # action page: <https://github.com/shivammathur/setup-php>
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets

      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          cd tests/php_test_files
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Init Composer Cache # Docs: <https://git.io/JfAKn#php---composer>
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: cd tests/php_test_files && composer update --prefer-dist --no-progress --ansi

      - name: Init Go modules Cache # Docs: <https://git.io/JfAKn#go---modules>
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Install Go dependencies
        run: go mod download

      - name: Start the broker
        run: docker compose -f tests/env/docker-compose.yaml up -d --wait

      - name: Run golang tests with coverage
        run: |
          cd tests
          mkdir ./coverage-ci
          go test -timeout 20m -v -race -cover -tags=debug -run TestRedialAfterOutage -coverpkg=github.com/roadrunner-server/beanstalk/v6/... -coverprofile=./coverage-ci/durability.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-durability
          path: ./tests/coverage-ci/durability.out

  codecov:
    name: Upload coverage to Codecov
    runs-on: ubuntu-latest
    needs: [beanstalk_test, beanstalk_durability]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Merge coverage files
        run: |
          echo "mode: atomic" > summary.txt
          cat coverage/*.out | grep -v "^mode:" | awk '{ sub(/github\.com\/roadrunner-server\/beanstalk\/v[56]\//, ""); print }' >> summary.txt
          # a profile that maps to no plugin source uploads fine and reports 0%
          blocks=$(($(wc -l < summary.txt) - 1))
          if [ "$blocks" -lt 10 ]; then
            echo "::error::coverage summary holds $blocks blocks, the profile does not map to plugin sources"
            exit 1
          fi

      - name: Upload to codecov
        uses: codecov/codecov-action@v7 # Docs: <https://github.com/codecov/codecov-action>
        with:
          files: summary.txt
          fail_ci_if_error: false
